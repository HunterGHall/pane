name: Publish pane-ui to PyPI

# Runs whenever a GitHub Release is published. Builds src/Pane (needs a
# Windows runner - it's a net8.0-windows/WPF target) and the pane-ui Python
# package, then uploads to PyPI via Trusted Publishing (OIDC) - no stored
# PyPI token/secret needed. The PyPI project must have this workflow
# registered as a trusted publisher first (pypi.org project settings ->
# Publishing), or the id-token exchange below will be rejected.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build native engine + package
        working-directory: python
        run: |
          python build_native.py
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          skip-existing: true
