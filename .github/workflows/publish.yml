name: Publish pane-ui to PyPI

# Runs whenever a GitHub Release is published.
#
# Split into two jobs because the two halves need different runners: building
# src/Pane needs Windows (it's a net8.0-windows/WPF target), but
# pypa/gh-action-pypi-publish is a Docker-based action that only runs on
# Linux. The build job uploads the wheel+sdist as a workflow artifact for the
# publish job to pick up.
#
# Publishing uses PyPI Trusted Publishing (OIDC) - no stored PyPI
# token/secret needed. The PyPI project must have this workflow registered
# as a trusted publisher first (pypi.org project settings -> Publishing), or
# the id-token exchange in the publish job will be rejected.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build native engine + package
        working-directory: python
        run: |
          python build_native.py
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
